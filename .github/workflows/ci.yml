name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Headless regression tests
        shell: powershell
        run: .\tests\run-native-regression.ps1
      - name: Build app and worker
        shell: powershell
        run: .\build.ps1 -Output dist\publish
