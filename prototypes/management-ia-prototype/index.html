<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTOTYP – Management window IA</title>
  <style>
    /*
      PROTOTYP – wegwerfbar.
      Frage: Wie passen Einstellungen, Verlauf, Wörterbuch, Modellverwaltung und
      appweite Befehle in ein ruhiges Fluent-Fenster ohne Navigationsicons?
      Drei Varianten, umschaltbar über ?variant=A|B|C.
    */
    * { box-sizing: border-box; }
    :root {
      color-scheme: light;
      font: 14px/1.4 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      --page: #dfe4e9;
      --mica: rgba(246, 247, 249, .88);
      --titlebar: rgba(235, 238, 242, .94);
      --sidebar: rgba(241, 243, 246, .9);
      --content-bg: rgba(249, 250, 251, .92);
      --surface: rgba(255, 255, 255, .84);
      --surface-solid: #fff;
      --text: #1b1b1d;
      --muted: #62666d;
      --line: rgba(23, 24, 27, .12);
      --line-strong: rgba(23, 24, 27, .2);
      --selected: rgba(23, 24, 27, .07);
      --accent: #c42b36;
      --accent-soft: rgba(196, 43, 54, .11);
      --good: #18794e;
      --shadow: 0 24px 70px rgba(38, 45, 52, .22);
    }
    body.dark {
      color-scheme: dark;
      --page: #0b0c0e;
      --mica: rgba(19, 20, 23, .96);
      --titlebar: rgba(16, 17, 20, .98);
      --sidebar: rgba(21, 23, 26, .97);
      --content-bg: rgba(25, 27, 31, .98);
      --surface: rgba(34, 36, 41, .9);
      --surface-solid: #23252a;
      --text: #f5f5f6;
      --muted: #b3b5ba;
      --line: rgba(255, 255, 255, .1);
      --line-strong: rgba(255, 255, 255, .19);
      --selected: rgba(255, 255, 255, .08);
      --accent-soft: rgba(230, 72, 83, .18);
      --good: #6dcc9b;
      --shadow: 0 24px 70px rgba(0, 0, 0, .48);
    }
    body { margin: 0; min-width: 940px; min-height: 700px; color: var(--text); background: var(--page); }
    button, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .stage { min-height: 100vh; display: grid; place-items: center; padding: 34px 34px 92px; }
    .window { width: min(1180px, calc(100vw - 68px)); height: min(720px, calc(100vh - 126px)); min-height: 570px; overflow: hidden; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--mica); box-shadow: var(--shadow); backdrop-filter: blur(24px) saturate(120%); }
    .titlebar { height: 48px; display: flex; align-items: center; padding-left: 13px; border-bottom: 1px solid var(--line); background: var(--titlebar); font-size: 12px; user-select: none; }
    .mark { width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; gap: 2px; margin-right: 9px; border: 1px solid rgba(0,0,0,.05); border-radius: 5px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); transform: rotate(180deg); }
    .mark i { width: 3px; height: 6px; border-radius: 2px; background: #c42b36; }
    .mark i:nth-child(1) { height: 9px; }
    .mark i:nth-child(2) { height: 15px; }
    .mark i:nth-child(3) { height: 12px; }
    .mark i:nth-child(4) { height: 7px; }
    .window-controls { margin-left: auto; align-self: stretch; display: flex; }
    .window-controls span { width: 46px; display: grid; place-items: center; font-size: 14px; }
    .window-controls span:last-child { width: 48px; }
    .page-title h1 { margin: 0; font-size: 28px; line-height: 1.15; letter-spacing: -.025em; }
    .page-title p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .nav-button { position: relative; width: 100%; min-height: 40px; padding: 0 14px; display: flex; align-items: center; gap: 11px; border: 0; border-radius: 5px; background: transparent; text-align: left; color: var(--muted); }
    .nav-button.active { color: var(--text); background: var(--selected); }
    .nav-button.active::before { content: ""; position: absolute; left: 0; top: 10px; width: 3px; height: 20px; border-radius: 2px; background: var(--accent); }
    .button { min-height: 34px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--surface-solid); }
    .button.primary { border-color: var(--accent); background: var(--accent); color: white; }
    .button.quiet { background: transparent; }
    .panel { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
    .row { min-height: 62px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 20px; padding: 10px 16px; border-top: 1px solid var(--line); }
    .row:first-child { border-top: 0; }
    .row strong { display: block; font-size: 13px; font-weight: 600; }
    .row small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .section-label { margin: 24px 0 8px; color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
    .pill { display: inline-flex; align-items: center; min-height: 25px; padding: 0 9px; border-radius: 999px; background: var(--selected); color: var(--muted); font-size: 11px; }
    .pill.good { background: rgba(24, 121, 78, .12); color: var(--good); }
    .toggle { width: 36px; height: 20px; padding: 3px; border-radius: 12px; background: var(--accent); display: flex; justify-content: flex-end; }
    .toggle::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: white; }
    .theme-button { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 5px; background: transparent; }

    /* A – klassische, stabile Bereichsnavigation. */
    .variant-a .body { height: calc(100% - 48px); display: grid; grid-template-columns: 222px 1fr; }
    .variant-a aside { display: flex; flex-direction: column; padding: 18px 12px 12px; border-right: 1px solid var(--line); background: var(--sidebar); }
    .variant-a .nav-group { display: grid; gap: 3px; }
    .variant-a .nav-caption { padding: 12px 14px 5px; color: var(--muted); font-size: 10px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
    .variant-a .app-actions { margin-top: auto; display: grid; gap: 3px; padding-top: 10px; border-top: 1px solid var(--line); }
    .variant-a .quit { color: var(--muted); }
    .variant-a main { min-width: 0; overflow: auto; padding: 32px 40px 42px; background: var(--content-bg); }
    .variant-a .content-header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .variant-a .back { margin-bottom: 15px; color: var(--text); }
    .nav-glyph { width: 18px; flex: 0 0 18px; text-align: center; font: 16px/1 "Segoe Fluent Icons", "Segoe MDL2 Assets", sans-serif; }
    .chevron { width: 11px; flex: 0 0 11px; margin-left: 2px; font-size: 22px; line-height: 1; }
    .history-list .row { grid-template-columns: 140px 1fr 126px; }
    .history-list time { color: var(--muted); font-size: 11px; }
    .history-list p { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-list .meta { justify-self: end; text-align: right; }

    /* B – schlanke Top-Navigation mit allen appweiten Befehlen im App-Menü. */
    .variant-b .titlebar { border-bottom: 0; }
    .variant-b .app-menu { margin-left: 14px; padding: 4px 9px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); }
    .variant-b .body { height: calc(100% - 48px); display: grid; grid-template-rows: 58px 1fr; }
    .variant-b .topnav { display: flex; align-items: stretch; gap: 28px; padding: 0 38px; border-block: 1px solid var(--line); background: rgba(255,255,255,.12); }
    .variant-b .topnav button { position: relative; border: 0; background: transparent; color: var(--muted); }
    .variant-b .topnav button.active { color: var(--text); }
    .variant-b .topnav button.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
    .variant-b main { overflow: auto; padding: 38px 48px; }
    .variant-b .content-header { display: flex; align-items: end; justify-content: space-between; margin-bottom: 28px; }
    .variant-b .empty { min-height: 340px; display: grid; place-items: center; padding: 46px; text-align: center; }
    .variant-b .empty-art { width: 78px; height: 78px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 28px; font-weight: 300; }
    .variant-b .empty h2 { margin: 0; font-size: 18px; }
    .variant-b .empty p { max-width: 430px; margin: 8px auto 20px; color: var(--muted); font-size: 12px; }
    .variant-b .menu-popover { position: absolute; z-index: 2; top: 42px; left: 132px; width: 204px; padding: 6px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface-solid); box-shadow: 0 12px 34px rgba(0,0,0,.2); display: none; }
    .variant-b.menu-open .menu-popover { display: block; }
    .variant-b .menu-popover button { width: 100%; min-height: 34px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; text-align: left; }
    .variant-b .menu-popover button:hover { background: var(--selected); }
    .variant-b .menu-popover hr { border: 0; border-top: 1px solid var(--line); }
    .variant-b .menu-popover .danger { color: var(--accent); }

    /* C – kompakte Hub-Shell; Modelle sind ein eigenständiger Bereich. */
    .variant-c .body { height: calc(100% - 48px); display: grid; grid-template-columns: 174px 1fr; }
    .variant-c aside { display: flex; flex-direction: column; padding: 18px 10px 12px; border-right: 1px solid var(--line); }
    .variant-c .nav-button { min-height: 38px; }
    .variant-c .bottom-actions { margin-top: auto; display: grid; gap: 4px; padding-top: 10px; border-top: 1px solid var(--line); }
    .variant-c main { min-width: 0; overflow: auto; padding: 30px 34px 40px; }
    .variant-c .content-header { display: flex; align-items: end; justify-content: space-between; margin-bottom: 20px; }
    .model-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .model-card { padding: 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .model-card.active { border-color: rgba(196,43,54,.38); box-shadow: inset 3px 0 var(--accent); }
    .model-card header { display: flex; justify-content: space-between; gap: 16px; }
    .model-card h2 { margin: 0; font-size: 14px; }
    .model-card p { min-height: 34px; margin: 7px 0 14px; color: var(--muted); font-size: 11px; }
    .model-card footer { display: flex; align-items: center; justify-content: space-between; padding-top: 13px; border-top: 1px solid var(--line); }
    .storage { margin-top: 14px; padding: 16px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 20px; }
    .storage small { display: block; margin-top: 3px; color: var(--muted); }
    .bar { height: 6px; margin-top: 9px; overflow: hidden; border-radius: 3px; background: var(--selected); }
    .bar i { display: block; width: 38%; height: 100%; background: var(--accent); }

    .switcher { position: fixed; z-index: 20; left: 50%; bottom: 24px; transform: translateX(-50%); height: 48px; display: flex; align-items: center; gap: 6px; padding: 5px; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; background: #17181b; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.34); }
    .switcher button { width: 38px; height: 38px; border: 0; border-radius: 50%; background: transparent; color: inherit; font-size: 18px; }
    .switcher button:hover { background: rgba(255,255,255,.12); }
    .switcher output { min-width: 230px; text-align: center; font-size: 12px; }
    .prototype-note { position: fixed; right: 18px; bottom: 18px; color: var(--muted); font-size: 10px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="switcher" aria-label="Prototypvarianten">
    <button id="previous" aria-label="Vorherige Variante">←</button>
    <output id="variant-label"></output>
    <button id="next" aria-label="Nächste Variante">→</button>
  </div>
  <span class="prototype-note">PROTOTYP · keine echte Datenänderung</span>

  <script>
    const variants = [
      { key: "A", name: "Bereiche links" },
      { key: "B", name: "Aufgaben oben" },
      { key: "C", name: "Kompakter Hub" }
    ];

    const mark = `<span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>`;
    const controls = `<span class="window-controls" aria-hidden="true"><span>—</span><span>□</span><span>×</span></span>`;
    const theme = `<button class="theme-button" data-theme-toggle title="Hell/Dunkel umschalten" aria-label="Hell/Dunkel umschalten">◐</button>`;

    const templates = {
      A: `
        <div class="stage variant-a"><section class="window">
          <header class="titlebar">${mark}<span>Local Dictation</span>${controls}</header>
          <div class="body">
            <aside>
              <div class="nav-group">
                <button class="nav-button active"><span class="nav-glyph" aria-hidden="true">&#xE81C;</span>Verlauf</button>
                <button class="nav-button"><span class="nav-glyph" aria-hidden="true">&#xE82D;</span>Wörterbuch</button>
              </div>
              <div class="app-actions">
                <button class="nav-button" data-open-settings><span class="nav-glyph" aria-hidden="true">&#xE713;</span>Einstellungen</button>
                <button class="nav-button quit"><span class="nav-glyph" aria-hidden="true">&#xE7E8;</span>Beenden</button>
              </div>
            </aside>
            <main>
              <header class="content-header">
                <div class="page-title"><h1>Verlauf</h1><p>Diktate der letzten 30 Tage.</p></div>
                <div>${theme} <button class="button">Alle löschen</button></div>
              </header>
              <section class="panel history-list">
                <div class="row"><time>Heute, 14:32</time><p>Bitte verschiebe den Termin auf nächsten Donnerstagvormittag.</p><span class="meta"><span class="pill good">Eingefügt</span><small>Whisper Large v3</small></span></div>
                <div class="row"><time>Heute, 11:08</time><p>Die Informationsarchitektur sollte auch bei vielen Einstellungen ruhig bleiben.</p><span class="meta"><span class="pill good">Eingefügt</span><small>Whisper Large v3</small></span></div>
                <div class="row"><time>Gestern, 18:47</time><p>Der Text konnte nicht automatisch eingefügt werden und wurde sicher aufbewahrt.</p><span class="meta"><span class="pill">Nicht eingefügt</span><small>Parakeet TDT</small></span></div>
                <div class="row"><time>Gestern, 09:15</time><p>Ein unvollständiges Diktat nach dem Wechsel des Audiogeräts.</p><span class="meta"><span class="pill">Unvollständig</span><small>Parakeet TDT</small></span></div>
                <div class="row"><time>Mo., 16:02</time><p>Kurze Notiz für die spätere Besprechung.</p><span class="meta"><span class="pill good">Eingefügt</span><small>Whisper Medium</small></span></div>
              </section>
            </main>
          </div>
        </section></div>`,
      B: `
        <div class="stage variant-b"><section class="window">
          <header class="titlebar">${mark}<span>Local Dictation</span><button class="app-menu" data-app-menu>App ▾</button>${controls}
            <div class="menu-popover"><button>Über Local Dictation</button><button>Ersteinrichtung wiederholen</button><hr><button class="danger">Local Dictation beenden</button></div>
          </header>
          <div class="body">
            <nav class="topnav"><button>Aktivität</button><button class="active">Sprache verbessern</button><button>Konfiguration</button></nav>
            <main>
              <header class="content-header">
                <div class="page-title"><h1>Sprache verbessern</h1><p>Begriffe vorgeben oder Text nach der Transkription ersetzen.</p></div>
                ${theme}
              </header>
              <section class="panel empty">
                <div><div class="empty-art">Aa</div><h2>Noch keine Wörterbucheinträge</h2><p>Ergänze einen Erkennungsbegriff für ungewöhnliche Namen oder lege eine exakte Ersetzungsregel an.</p><button class="button primary">Eintrag hinzufügen</button> <button class="button">Importieren</button></div>
              </section>
            </main>
          </div>
        </section></div>`,
      C: `
        <div class="stage variant-c"><section class="window">
          <header class="titlebar">${mark}<span>Local Dictation · Modelle</span>${controls}</header>
          <div class="body">
            <aside>
              <button class="nav-button">Start</button>
              <button class="nav-button">Verlauf</button>
              <button class="nav-button">Wörterbuch</button>
              <button class="nav-button active">Modelle</button>
              <button class="nav-button">Einstellungen</button>
              <div class="bottom-actions"><button class="nav-button">App-Menü</button></div>
            </aside>
            <main>
              <header class="content-header">
                <div class="page-title"><h1>Modelle</h1><p>Lokale Transkriptionsmodelle auswählen und verwalten.</p></div>
                <div>${theme} <button class="button">Modell hinzufügen</button></div>
              </header>
              <div class="model-grid">
                <article class="model-card active"><header><h2>Whisper Large v3 Turbo</h2><span class="pill good">Aktiv</span></header><p>Hohe Genauigkeit, empfohlen für deine NVIDIA-GPU.</p><footer><small>1,6 GB · GPU</small><button class="button quiet">Verwalten</button></footer></article>
                <article class="model-card"><header><h2>Parakeet TDT 0.6B</h2><span class="pill">Bereit</span></header><p>Schnelle lokale Transkription mit geringerem Ressourcenbedarf.</p><footer><small>2,4 GB · CPU/GPU</small><button class="button quiet">Aktivieren</button></footer></article>
                <article class="model-card"><header><h2>Whisper Medium</h2><span class="pill">Bereit</span></header><p>Ausgewogene Alternative für Geräte mit weniger Grafikspeicher.</p><footer><small>1,5 GB · CPU/GPU</small><button class="button quiet">Aktivieren</button></footer></article>
                <article class="model-card"><header><h2>Whisper Small</h2><span class="pill">Download</span></header><p>Kompakt und schnell, mit geringerer Erkennungsgenauigkeit.</p><footer><small>466 MB</small><button class="button">Herunterladen</button></footer></article>
              </div>
              <section class="panel storage"><div><strong>Modellspeicher</strong><small>5,5 GB von 14,4 GB verwendet</small><div class="bar"><i></i></div></div><button class="button">Ordner öffnen</button></section>
            </main>
          </div>
        </section></div>`
    };

    const settingsATemplate = `
      <div class="stage variant-a"><section class="window">
        <header class="titlebar">${mark}<span>Local Dictation · Einstellungen</span>${controls}</header>
        <div class="body">
          <aside>
            <button class="nav-button back" data-back-main><span class="chevron" aria-hidden="true">‹</span>Zurück</button>
            <div class="nav-group">
              <button class="nav-button active">Transkription &amp; Modelle</button>
              <button class="nav-button">Audio</button>
              <button class="nav-button">Hotkeys</button>
              <button class="nav-button">Ausgabe</button>
              <button class="nav-button">Darstellung</button>
            </div>
          </aside>
          <main>
            <header class="content-header">
              <div class="page-title"><h1>Transkription &amp; Modelle</h1><p>Aktives Modell und Verhalten der lokalen Transkription.</p></div>
              ${theme}
            </header>
            <p class="section-label">Aktives Modell</p>
            <section class="panel">
              <div class="row"><span><strong>Whisper Large v3 Turbo</strong><small>Für deine NVIDIA-GPU empfohlen · 1,6 GB</small></span><button class="button">Modelle verwalten</button></div>
              <div class="row"><span><strong>Modell nach Inaktivität entladen</strong><small>Das Modell bleibt standardmäßig geladen.</small></span><span class="pill">Nie</span></div>
            </section>
            <p class="section-label">Transkription</p>
            <section class="panel">
              <div class="row"><span><strong>Sprache</strong><small>Sprache automatisch erkennen.</small></span><span class="pill">Automatisch</span></div>
              <div class="row"><span><strong>Startbereitschaft</strong><small>Das aktive Modell wird beim App-Start im Hintergrund geladen.</small></span><span class="toggle" aria-hidden="true"></span></div>
            </section>
          </main>
        </div>
      </section></div>`;

    function currentIndex() {
      const key = new URLSearchParams(location.search).get("variant")?.toUpperCase();
      const index = variants.findIndex(item => item.key === key);
      return index < 0 ? 0 : index;
    }

    function render() {
      const variant = variants[currentIndex()];
      const isSettings = variant.key === "A" && new URLSearchParams(location.search).get("view") === "settings";
      document.getElementById("app").innerHTML = isSettings ? settingsATemplate : templates[variant.key];
      document.getElementById("variant-label").textContent = `${variant.key} — ${variant.name}`;
      document.querySelector("[data-theme-toggle]")?.addEventListener("click", () => document.body.classList.toggle("dark"));
      document.querySelector("[data-app-menu]")?.addEventListener("click", () => document.querySelector(".variant-b")?.classList.toggle("menu-open"));
      document.querySelector("[data-open-settings]")?.addEventListener("click", () => {
        const url = new URL(location.href);
        url.searchParams.set("view", "settings");
        history.replaceState({}, "", url);
        render();
      });
      document.querySelector("[data-back-main]")?.addEventListener("click", () => {
        const url = new URL(location.href);
        url.searchParams.delete("view");
        history.replaceState({}, "", url);
        render();
      });
    }

    function go(delta) {
      const next = variants[(currentIndex() + delta + variants.length) % variants.length];
      const url = new URL(location.href);
      url.searchParams.set("variant", next.key);
      url.searchParams.delete("view");
      history.replaceState({}, "", url);
      render();
    }

    document.getElementById("previous").addEventListener("click", () => go(-1));
    document.getElementById("next").addEventListener("click", () => go(1));
    window.addEventListener("keydown", event => {
      if (["INPUT", "TEXTAREA", "SELECT"].includes(event.target.tagName) || event.target.isContentEditable) return;
      if (event.key === "ArrowLeft") go(-1);
      if (event.key === "ArrowRight") go(1);
    });
    window.addEventListener("popstate", render);
    render();
  </script>
</body>
</html>
